<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Info Agent</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-50 min-h-screen">
    <div id="app" class="max-w-4xl mx-auto py-10 px-4">
        
        <header class="mb-10 text-center">
            <h1 class="text-4xl font-bold text-gray-800 mb-2">OpenClaw <span class="text-blue-600">Agent</span></h1>
            <p class="text-gray-500">自动化技术情报聚合与 AI 深度解析 (Pure Frontend Demo)</p>
        </header>

        <div class="bg-white p-6 rounded-xl shadow-sm mb-6 border border-gray-100">
            <div class="flex flex-wrap gap-4 items-end">
                <div class="flex-1 min-w-[300px]">
                    <label class="block text-sm font-medium text-gray-700 mb-1">DeepSeek API Key (仅保存在本地浏览器)</label>
                    <input v-model="apiKey" type="password" placeholder="sk-..." class="w-full p-2 border rounded-md focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <button @click="fetchFeeds" :disabled="loading" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-md transition-all flex items-center">
                    <i v-if="loading" class="fas fa-spinner fa-spin mr-2"></i>
                    {{ loading ? '抓取中...' : '同步最新资讯' }}
                </button>
            </div>
        </div>

        <div class="space-y-4">
            <div v-for="(item, index) in newsList" :key="index" class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 hover:border-blue-300 transition-colors">
                <div class="flex justify-between items-start mb-3">
                    <h3 class="text-lg font-bold text-gray-800">{{ item.title }}</h3>
                    <span class="text-xs font-mono bg-blue-50 text-blue-600 px-2 py-1 rounded">{{ item.source }}</span>
                </div>
                
                <p class="text-gray-600 text-sm mb-4 line-clamp-2">{{ item.description }}</p>

                <div v-if="item.aiSummary" class="bg-blue-50 p-4 rounded-lg mb-4 border-l-4 border-blue-400">
                    <div class="flex items-center mb-2 text-blue-700 font-medium text-sm">
                        <i class="fas fa-robot mr-2"></i> OpenClaw AI 摘要
                    </div>
                    <p class="text-gray-700 text-sm leading-relaxed">{{ item.aiSummary }}</p>
                </div>

                <div class="flex gap-2">
                    <button @click="summarize(index)" :disabled="item.isProcessing || !apiKey" 
                        class="text-xs bg-gray-800 text-white px-3 py-1.5 rounded hover:bg-black disabled:opacity-50">
                        <i v-if="item.isProcessing" class="fas fa-spinner fa-spin mr-1"></i>
                        AI 深度解析
                    </button>
                    <a :href="item.link" target="_blank" class="text-xs border border-gray-300 px-3 py-1.5 rounded hover:bg-gray-50 text-gray-600">
                        阅读原文
                    </a>
                </div>
            </div>
        </div>

        <div v-if="newsList.length === 0 && !loading" class="text-center py-20 text-gray-400">
            <i class="fas fa-rss-square text-5xl mb-4"></i>
            <p>点击上方按钮开始同步技术源 (Hacker News / RSS)</p>
        </div>
    </div>

    <script>
        const { createApp, ref } = Vue;

        createApp({
            setup() {
                const apiKey = ref('');
                const loading = ref(false);
                const newsList = ref([]);

                // 抓取逻辑 (利用 rss2json 绕过跨域)
                const fetchFeeds = async () => {
                    loading.value = true;
                    try {
                        const rssUrl = 'https://news.ycombinator.com/rss';
                        const response = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}`);
                        const data = await response.json();
                        
                        newsList.value = data.items.map(i => ({
                            title: i.title,
                            link: i.link,
                            description: i.description.replace(/<[^>]+>/g, '').slice(0, 150) + '...',
                            source: 'Hacker News',
                            aiSummary: '',
                            isProcessing: false
                        }));
                    } catch (e) {
                        alert('同步失败，请检查网络');
                    } finally {
                        loading.value = false;
                    }
                };

                // AI 解析逻辑 (直连 LLM API)
                const summarize = async (index) => {
                    const item = newsList.value[index];
                    item.isProcessing = true;
                    
                    try {
                        const res = await fetch('https://api.deepseek.com/chat/completions', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${apiKey.value}`
                            },
                            body: JSON.stringify({
                                model: "deepseek-chat",
                                messages: [
                                    {role: "system", content: "你是一个技术专家。请对以下技术资讯进行中文摘要，指出其核心技术价值。字数控制在100字以内。"},
                                    {role: "user", content: `标题: ${item.title}\n描述: ${item.description}`}
                                ]
                            })
                        });
                        const data = await res.json();
                        item.aiSummary = data.choices[0].message.content;
                    } catch (e) {
                        item.aiSummary = "解析失败：请确保 API Key 正确并检查网络连接。";
                    } finally {
                        item.isProcessing = false;
                    }
                };

                return { apiKey, loading, newsList, fetchFeeds, summarize };
            }
        }).mount('#app');
    </script>
</body>
</html>
